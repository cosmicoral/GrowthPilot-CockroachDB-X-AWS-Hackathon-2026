# AWS Amplify Hosting — frontend (Vite static build).
#
# VITE_API_BASE_URL must be set in the Amplify console under
# App settings -> Environment variables. Vite inlines it at build time, so
# changing it requires a redeploy, not just a restart.
#
# Configure these rules in the Amplify console, in this order:
#   /api/<*> -> https://<backend-domain>/api/<*>  200 (Rewrite)
#   /<*>     -> /index.html                       404-200 (Rewrite)
# The API rule makes the session cookie first-party in Safari. Keep
# VITE_API_BASE_URL empty once that rule is active.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
